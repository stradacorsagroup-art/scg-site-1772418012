name: Sync Membership Inventory

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Sync inventory from Command Center
        run: npm run sync:membership

      - name: Build check
        run: npm run build

      - name: Commit & push if changed
        run: |
          if git diff --quiet; then
            echo "No inventory changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/inventory.ts
          git commit -m "chore: sync membership inventory from command center"
          git push
